<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" data-valve-standard="1">
  <!-- The Valve Standard (Fritz, 2026-11-05, Rule 5.29): every valve in the same 300 x 300 box, its pipe through the middle, so its IPs
       are always on the same spots. The drawing is at scale 1.1 (the same for every Skynet valve); straight pipe runs out to the edges. -->
  <!-- the box-edge end looks like the end of the valve (OakBarn Brewery, 2026-11-23: "Make the connections at the edge of the box that look like the end of the valve or Pump"; Rule 5.29): the valve body tube runs out to a TC ferrule on the box edge, where its IP is -->
  <rect x="0" y="135.5" width="74" height="29" fill="#7f7f7f"/><path d="M0 140.5 H74.0" stroke="#a3a3a3" stroke-width="3"/><rect x="0.5" y="129.5" width="12" height="41" rx="3" fill="#6f6f6f" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="226" y="135.5" width="74" height="29" fill="#7f7f7f"/><path d="M226 140.5 H300.0" stroke="#a3a3a3" stroke-width="3"/><rect x="287.5" y="129.5" width="12" height="41" rx="3" fill="#6f6f6f" stroke="#2b2b2b" stroke-width="2"/>
  <g transform="translate(73 48.8) scale(1.1)">
  <!-- Skynet solenoid gas valve, closed (ring; brass body, black coil with a flame), horizontal: pipe ends at the middle of the Left and Right edges, coil on top -->
  <g>
    <rect x="8" y="81" width="124" height="22" fill="#8f9296" stroke="#2b2b2b" stroke-width="3"/>
    <path d="M10 87 H130" stroke="#c4c7cb" stroke-width="3" stroke-linecap="round"/>
    <rect x="2" y="74" width="9" height="36" rx="3" fill="#8f9296" stroke="#2b2b2b" stroke-width="3"/>
    <rect x="129" y="74" width="9" height="36" rx="3" fill="#8f9296" stroke="#2b2b2b" stroke-width="3"/>
    <rect x="40" y="72" width="60" height="40" rx="5" fill="#c9a23a" stroke="#6b5414" stroke-width="3"/>
    <path d="M46 78 H94" stroke="#e8cc6e" stroke-width="3" stroke-linecap="round"/>
    <rect x="62" y="58" width="16" height="16" fill="#8f9296" stroke="#2b2b2b" stroke-width="3"/>
    <circle cx="70" cy="92" r="9" fill="#ffffff" stroke="#111" stroke-width="4"/>
    <rect x="44" y="12" width="52" height="48" rx="6" fill="#2b2b2b" stroke="#111" stroke-width="3"/>
    <rect x="44" y="12" width="52" height="10" rx="5" fill="#4a4a4a"/>
  </g>
  <path transform="translate(70 38)" d="M0 -12 C-8 -2 -6 6 0 12 C6 6 8 -2 0 -12 Z" fill="#f08a1a" stroke="#ffd21a" stroke-width="2"/>
</g>
</svg>
