<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" data-valve-standard="1">
  <!-- The Valve Standard (Fritz, 2026-11-05, Rule 5.29): every valve in the same 300 x 300 box, its pipe through the middle, so its IPs
       are always on the same spots. The drawing is at scale 1.1 (the same for every Skynet valve); straight pipe runs out to the edges. -->
  <rect x="137.5" y="0" width="25" height="74" fill="#8a8f96"/>
  <rect x="137.5" y="226" width="25" height="74" fill="#8a8f96"/>
  <g transform="translate(119.2 73) scale(1.1)">
  <!-- Skynet motorized ball valve, closed, vertical, motor on the right (Fritz's drawing, 2026-11-02): IPs at the top and bottom ferrule faces, 28 in from the left -->
  <g transform="translate(120 0) rotate(90)">
  <path d="M42 62 Q33.0 78 24 78" fill="none" stroke="#cfcfcf" stroke-width="2.5"/>
  <rect x="27" y="22" width="86" height="25.2" rx="3" fill="#1d4f9a" stroke="#000" stroke-width="1.5"/>
  <rect x="34" y="6" width="72" height="56" rx="7" fill="#2f72d0" stroke="#000" stroke-width="2.5"/>
  <rect x="35.5" y="7.5" width="69" height="12" rx="6" fill="#5b95e6"/>
  <ellipse cx="61.4" cy="13" rx="9.4" ry="3.5" fill="none" stroke="#d8d8d8" stroke-width="1.5"/>
  <ellipse cx="81.5" cy="13" rx="6.5" ry="3" fill="#d8d8d8"/>
  <path d="M37 38.5 H103" stroke="#1d4f9a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="64.0" y="25.6" width="12" height="34.7" rx="2" fill="#3d82e3" stroke="#1d4f9a" stroke-width="1"/>
  <rect x="52" y="60" width="36" height="11" fill="#1d4f9a" stroke="#000" stroke-width="1.5"/>
  <g fill="#000" stroke="#000" stroke-width="3.2" stroke-linejoin="round">
    <path d="M12 80 H44 A10 10 0 0 0 54 70 H86 A10 10 0 0 0 96 80 H128 V104 H12 Z"/>
    <rect x="0" y="-19" width="11" height="38" rx="5" transform="translate(1.50 92.00) rotate(0.00)"/>
    <rect x="0" y="-19" width="11" height="38" rx="5" transform="translate(138.50 92.00) rotate(180.00)"/>
  </g>
  <g fill="#808080">
    <path d="M12 80 H44 A10 10 0 0 0 54 70 H86 A10 10 0 0 0 96 80 H128 V104 H12 Z"/>
    <rect x="0" y="-19" width="11" height="38" rx="5" transform="translate(1.50 92.00) rotate(0.00)"/>
    <rect x="0" y="-19" width="11" height="38" rx="5" transform="translate(138.50 92.00) rotate(180.00)"/>
  </g>
  <circle cx="70" cy="92" r="8" fill="#fff" stroke="#111" stroke-width="4"/>
