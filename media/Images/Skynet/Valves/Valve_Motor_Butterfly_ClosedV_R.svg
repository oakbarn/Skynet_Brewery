<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" data-valve-standard="1">
  <!-- The Valve Standard (Fritz, 2026-11-05, Rule 5.29): every valve in the same 300 x 300 box, its pipe through the middle, so its IPs
       are always on the same spots. The drawing is at scale 1.1 (the same for every Skynet valve); straight pipe runs out to the edges. -->
  <rect x="137.5" y="0" width="25" height="74" fill="#8a8f96"/>
  <rect x="137.5" y="226" width="25" height="74" fill="#8a8f96"/>
  <g transform="translate(111.5 73) scale(1.1)">
  <!-- Skynet motorized butterfly valve, closed, vertical, motor on the right (Fritz's drawing, 2026-11-02): IPs at the top and bottom ferrule faces, 35 in from the left -->
  <g transform="translate(170 0) rotate(90)">
  <path d="M34 84 Q24.0 104 14 104" fill="none" stroke="#cfcfcf" stroke-width="2.5"/>
  <rect x="19" y="22" width="102" height="35.1" rx="3" fill="#4a4a4a" stroke="#000" stroke-width="1.5"/>
  <rect x="26" y="6" width="88" height="78" rx="7" fill="#6b6b6b" stroke="#000" stroke-width="2.5"/>
  <rect x="27.5" y="7.5" width="85" height="12" rx="6" fill="#8c8c8c"/>
  <ellipse cx="59.4" cy="13" rx="11.4" ry="3.5" fill="none" stroke="#d8d8d8" stroke-width="1.5"/>
  <ellipse cx="84.1" cy="13" rx="7.9" ry="3" fill="#d8d8d8"/>
  <path d="M29 51.2 H111" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="64.0" y="33.3" width="12" height="48.4" rx="2" fill="#777777" stroke="#4a4a4a" stroke-width="1"/>
  <g fill="#000" stroke="#000" stroke-width="3.2" stroke-linejoin="round">
    <rect x="12" y="122" width="116" height="26"/>
    <rect x="0" y="-21" width="11.5" height="42" rx="5" transform="translate(1.50 135.00) rotate(0.00)"/>
    <rect x="0" y="-21" width="11.5" height="42" rx="5" transform="translate(138.50 135.00) rotate(180.00)"/>
  </g>
  <g fill="#808080">
    <rect x="12" y="122" width="116" height="26"/>
    <rect x="0" y="-21" width="11.5" height="42" rx="5" transform="translate(1.50 135.00) rotate(0.00)"/>
    <rect x="0" y="-21" width="11.5" height="42" rx="5" transform="translate(138.50 135.00) rotate(180.00)"/>
  </g>
  <rect x="29" y="110" width="14" height="50" rx="3" fill="#c0c0c0" stroke="#555" stroke-width="2"/>
  <rect x="97" y="110" width="14" height="50" rx="3" fill="#c0c0c0" stroke="#555" stroke-width="2"/>
  <rect x="62" y="84" width="16" height="16" fill="#808080" stroke="#000" stroke-width="2"/>
  <rect x="42" y="98" width="56" height="70" rx="8" fill="#c0c0c0" stroke="#555" stroke-width="2.5"/>
  <circle cx="70" cy="134" r="8" fill="#fff" stroke="#111" stroke-width="4"/>
  </g>
</g>
</svg>
