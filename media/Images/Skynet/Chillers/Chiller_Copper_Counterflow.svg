<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 245">
  <!-- Skynet Copper Counterflow Chiller (redrawn as plain SVG from Fritz's Copper_CounterFlow.svg, 2026-11-02): a copper coil of
