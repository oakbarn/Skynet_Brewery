<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <!-- On overlay (Fritz, 2026-11-04): a lightning bolt over the middle of a valve or pump that flashes red and yellow while it is on -->
  <path d="M60 6 L22 56 H45 L35 94 L78 40 H54 Z" fill="#e8141c" stroke="#ffd200" stroke-width="5" stroke-linejoin="round">
    <animate attributeName="fill" values="#e8141c;#ffd200" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#ffd200;#e8141c" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
  </path>
</svg>
