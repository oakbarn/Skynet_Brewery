<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" data-pump-standard="1">
  <!-- Skynet Pump Standard (Fritz, 2026-11-05, Rule 5.11): every pump drawn in the same 300 x 300 box, shown 150 x 150; inlet IP at (285, 150), outlet IP at (243, 56). Cover for Pump_Chugger_SS_90_Inlet_Motor.svg, same box and spots. -->
  <g transform="translate(216.6 150) rotate(0)">
  <!-- Skynet pump Cover Overlay: User cover: only the outline and shading; the panel fills the cover shape with the color the user sets. Same box as Pump_Chugger_SS_90_Inlet_Motor.svg, so it lies exactly over it; covers the motor body only (like the Blichmann RipTide); see-through around the cover. -->
  <defs><clipPath id="in"><path d="M-153.8 -38 Q-153.8 -48 -143.8 -48 H-35.8 Q-31.8 -48 -31.8 -44 V44 Q-31.8 48 -35.8 48 H-143.8 Q-153.8 48 -153.8 38 Z"/></clipPath></defs>
  <g stroke-linejoin="round">
    <rect x="-153.8" y="-48" width="122" height="10" fill="#ffffff" fill-opacity="0.32" clip-path="url(#in)"/>
    <rect x="-153.8" y="38" width="122" height="10" fill="#000000" fill-opacity="0.22" clip-path="url(#in)"/>
    <rect x="-135.8" y="-12" width="34" height="2" rx="0.8" fill="#000000" fill-opacity="0.45"/>
    <rect x="-135.8" y="-6" width="34" height="2" rx="0.8" fill="#000000" fill-opacity="0.45"/>
    <rect x="-135.8" y="0" width="34" height="2" rx="0.8" fill="#000000" fill-opacity="0.45"/>
    <rect x="-135.8" y="6" width="34" height="2" rx="0.8" fill="#000000" fill-opacity="0.45"/>
    <path d="M-37.8 -46 V46" stroke="#000000" stroke-opacity="0.35" stroke-width="1.2"/>
    <path d="M-153.8 -38 Q-153.8 -48 -143.8 -48 H-35.8 Q-31.8 -48 -31.8 -44 V44 Q-31.8 48 -35.8 48 H-143.8 Q-153.8 48 -153.8 38 Z" fill="none" stroke="#111111" stroke-width="1.8"/>
  </g>
  </g>
</svg>
