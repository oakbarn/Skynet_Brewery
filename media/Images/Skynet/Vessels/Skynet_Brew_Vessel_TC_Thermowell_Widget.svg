<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 236 256">
  <!-- Skynet Vessel Widget "Brew_Vessel_TC_Thermowell_Widget" (Fritz, 2026-10-23): Brew Vessel Low TC Output + a TC 1.5 Thermowell at Center 5 in (center 5 in above the bottom).
       All Skynet Brew Vessel Widgets share one box (viewBox -20 0 236 256, 10 units = 1 in) so a port position is the same spot on each;
       face-on TC ports: flange, gasket groove, opening; side ports: tube and flange seen side-on. -->
  <rect x="5" y="9" width="182" height="12" rx="3" fill="#808080" stroke="#111" stroke-width="3"/>
  <rect x="12.5" y="22" width="167" height="227" rx="7" fill="#808080" stroke="#111" stroke-width="3"/>
  <g stroke="#111">
    <circle cx="96" cy="239" r="9.9" fill="#b4b7bb" stroke-width="1.5"/>
    <circle cx="96" cy="239" r="8.4" fill="none" stroke="#6d6d6d" stroke-width="1"/>
    <circle cx="96" cy="239" r="6.9" fill="#3a3a3a" stroke-width="1"/>
  </g>
  <g stroke="#111">
    <circle cx="96" cy="199" r="9.9" fill="#b4b7bb" stroke-width="1.5"/>
    <circle cx="96" cy="199" r="8.4" fill="none" stroke="#6d6d6d" stroke-width="1"/>
    <circle cx="96" cy="199" r="6.9" fill="#3a3a3a" stroke-width="1"/>
  </g>
</svg>
