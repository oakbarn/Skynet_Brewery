  </g>
  </g>
</mask></defs><rect width="300" height="300" fill="#d32f2f" mask="url(#rplCoverMask)"/>
  <!-- Skynet Pump Standard (Fritz, 2026-11-05, Rule 5.11): every pump drawn in the same 300 x 300 box, shown 150 x 150; inlet IP at (285, 150), outlet IP at (243, 56). Cover for Pump_Riptide_SS_Center_Inlet.svg, same box and spots. -->
  <g transform="translate(81.88 56) scale(2)">

  <!-- Skynet pump Cover Overlay: User cover: only the outline and shading; the panel fills the cover shape (from the Red cover) with the color the user sets. Same box as Pump_Riptide_SS_Center_Inlet.svg, so it lies exactly over it; see-through around the cover. -->
  <defs><clipPath id="in_rc"><path d="M0.3 66.0 V36.5 Q0.3 25.0 11.8 25.0 H53.1 Q64.6 25.0 64.6 36.5 V66.0 Z"/></clipPath></defs>
  <g stroke-linejoin="round">
    
    <rect x="0.3" y="25.0" width="64.3" height="8.2" fill="#ffffff" fill-opacity="0.32" clip-path="url(#in_rc)"/>
