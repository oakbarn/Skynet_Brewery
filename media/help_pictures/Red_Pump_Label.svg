<svg xmlns="http://www.w3.org/2000/svg" width="363" height="180" viewBox="0 0 363 180">
<!-- Skynet's own drawing, made by hand so it stays sharp at any size (Help picture). It is used in place of the PNG with the same name. 2026-11-17: the pump is now the Skynet pump (Pump_Riptide_SS_Center_Inlet.svg, Red Cover), so no part of the old photo pump is left. -->
<title>Red Pump: the Label above the pump</title>
<rect width="363" height="180" fill="#fff"/><rect x="8" y="18" width="197" height="162" fill="#262626"/><svg x="16" y="40" width="150" height="150" viewBox="0 0 300 300" overflow="visible"><!-- The Skynet pump today (Pump_Riptide_SS_Center_Inlet.svg with its Red Cover), as the panel draws it -->
  <!-- Skynet Pump Standard (Fritz, 2026-11-05, Rule 5.11): every pump drawn in the same 300 x 300 box, shown 150 x 150; inlet IP at (285, 150), outlet IP at (243, 56). Drawn to scale, 20 units = 1 inch here (10 at 150 x 150); its port tube made 0.2" (inlet) and 0" (outlet) longer to reach the spots. -->
  <g transform="translate(81.88 56) scale(2)">
    <rect x="99" y="42.8" width="2.56" height="8.4" fill="#b9bcc0" stroke="#2b2b2b" stroke-width="1.2"/>

  <!-- Skynet drawing: Blichmann Riptide, cover off (stainless head, center inlet, valve on the outlet). Off, no cover. 10 units = 1 inch. Inlet IP at the tip of the right-hand port (0.994, 0.63), outlet IP at the tip of the top port (0.804, 0.0). -->
  <g stroke-linejoin="round">
