<rect x="330" y="266" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="353.0" y="283" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">IN2</text>
<circle cx="330" cy="278" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="437" y="198" width="93" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="483.5" y="215" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">K1 COM-NO</text>
<circle cx="530" cy="210" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="437" y="288" width="93" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="483.5" y="305" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">K2 COM-NO</text>
<circle cx="530" cy="300" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 190 L330 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L330 234" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L330 234" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 278 L330 278" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 278 L330 278" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="30" y="400" width="300" height="120" rx="10" fill="#fff" stroke="#d01818" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="180.0" y="424" font-size="16" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Gas: Licensed Plumber or</text>
<text x="180.0" y="444" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">HVAC professional for the gas side</text>
<text x="180" y="490" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">tank &gt; regulator &gt; flame safety &gt; solenoid</text>
<rect x="640" y="120" width="290" height="130" rx="10" fill="#fff3e0" stroke="#333" stroke-width="2.5"/>
<text x="785.0" y="144" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">24 V Gas Solenoid Valve</text>
<text x="785.0" y="164" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">normally closed, listed for gas</text>
<rect x="640" y="300" width="290" height="130" rx="10" fill="#fff3e0" stroke="#333" stroke-width="2.5"/>
<text x="785.0" y="324" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Igniter</text>
<text x="785.0" y="344" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(its own supply; AC = Electrician)</text>
<path d="M530 210 L600 210 L600 185 L640 185" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M530 300 L600 300 L600 365 L640 365" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="785" y="460" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">Each relay switches the + of its part</text>
<line x1="30" y1="595" x2="60" y2="595" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="595" x2="147.6" y2="595" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">control Ports</text>
<line x1="277.20000000000005" y1="595" x2="307.20000000000005" y2="595" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/>
<text x="315.20000000000005" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">switched power</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Gas Solenoid and Igniter</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Two Ports  &gt;  two relays  ·  24 V to the gas solenoid, the igniter's own power to the igniter</text>
<rect x="0" y="600" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="626" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Gas can explode or kill. Electricity can kill. A general method only. Consult a Licensed Electrician, Plumber or HVAC professional.</text>
</svg>
