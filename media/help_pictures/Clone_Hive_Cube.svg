<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <title>A Device and its Clones are one: the Clone Hive cube</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#7dff8a" stop-opacity=".55"/><stop offset="1" stop-color="#7dff8a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M7 0H0V7" fill="none" stroke="#3fd35a" stroke-width=".7" opacity=".6"/></pattern>
  </defs>
  <rect width="480" height="300" rx="14" fill="#10161b"/>
  <circle cx="130" cy="140" r="115" fill="url(#glow)"/>
  <!-- the cube: front, top and side faces -->
  <g stroke="#5cf06f" stroke-width="2" stroke-linejoin="round">
    <path d="M60 110 L150 110 L150 200 L60 200 Z" fill="#14301b"/>
    <path d="M60 110 L150 110 L150 200 L60 200 Z" fill="url(#grid)"/>
    <path d="M60 110 L100 80 L190 80 L150 110 Z" fill="#1c4426"/>
    <path d="M60 110 L100 80 L190 80 L150 110 Z" fill="url(#grid)" opacity=".7"/>
    <path d="M150 110 L190 80 L190 170 L150 200 Z" fill="#0f2615"/>
    <path d="M150 110 L190 80 L190 170 L150 200 Z" fill="url(#grid)" opacity=".6"/>
  </g>
  <text x="125" y="236" fill="#9dffab" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">One set of Properties</text>
  <!-- links to the Device and its Clones -->
  <g stroke="#5cf06f" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <path d="M190 100 C240 100 250 60 300 60"/>
    <path d="M190 135 L300 140"/>
    <path d="M190 165 C240 170 250 220 300 220"/>
  </g>
  <!-- three identical heating elements, all On together -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e8f5ea">
    <g transform="translate(300 38)">
      <rect width="150" height="44" rx="8" fill="#1d2a22" stroke="#5cf06f" stroke-width="2"/>
      <path d="M14 30 q8 -16 16 0 t16 0 t16 0" fill="none" stroke="#ff6a2b" stroke-width="4" stroke-linecap="round"/>
      <text x="74" y="27">Device</text>
    </g>
    <g transform="translate(300 118)">
      <rect width="150" height="44" rx="8" fill="#1d2a22" stroke="#5cf06f" stroke-width="2"/>
      <path d="M14 30 q8 -16 16 0 t16 0 t16 0" fill="none" stroke="#ff6a2b" stroke-width="4" stroke-linecap="round"/>
      <text x="74" y="27">Clone 1</text>
    </g>
    <g transform="translate(300 198)">
      <rect width="150" height="44" rx="8" fill="#1d2a22" stroke="#5cf06f" stroke-width="2"/>
      <path d="M14 30 q8 -16 16 0 t16 0 t16 0" fill="none" stroke="#ff6a2b" stroke-width="4" stroke-linecap="round"/>
      <text x="74" y="27">Clone 2</text>
    </g>
  </g>
  <text x="240" y="282" fill="#cfd8dc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Turn one On and all of them are On: the Device and its Clones are ONE.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
