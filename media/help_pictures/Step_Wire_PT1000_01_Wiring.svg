<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): PT1000 RTD Probe on a MAX31865 Board. A general method only, not a wiring plan. -->
<rect width="960" height="600" fill="#ffffff"/>
<rect x="30" y="100" width="200" height="330" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="130.0" y="124" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="130.0" y="144" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="184" y="168" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="185" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">5V</text>
<circle cx="230" cy="180" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="184" y="212" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="229" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="230" cy="224" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="137" y="256" width="93" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="183.5" y="273" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D52 (SCK)</text>
<circle cx="230" cy="268" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="128" y="300" width="102" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="179.0" y="317" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D50 (MISO)</text>
<circle cx="230" cy="312" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="128" y="344" width="102" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="179.0" y="361" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D51 (MOSI)</text>
<circle cx="230" cy="356" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="146" y="388" width="84" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="188.0" y="405" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D48 (CS)</text>
<circle cx="230" cy="400" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="420" y="100" width="220" height="330" rx="10" fill="#f3e5f5" stroke="#333" stroke-width="2.5"/>
<text x="530.0" y="124" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">MAX31865 Board</text>
<text x="530.0" y="144" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">PT1000 type (4300 ohm ref.)</text>
<rect x="420" y="168" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="185" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Vin</text>
<circle cx="420" cy="180" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 180 L420 180" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="420" y="212" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="229" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="420" cy="224" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 224 L420 224" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="420" y="256" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="273" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">CLK</text>
<circle cx="420" cy="268" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 268 L420 268" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="420" y="300" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="317" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">SDO</text>
<circle cx="420" cy="312" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 312 L420 312" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="420" y="344" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="361" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">SDI</text>
<circle cx="420" cy="356" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 356 L420 356" fill="none" stroke="#6a1b9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="420" y="388" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="405" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">CS</text>
<circle cx="420" cy="400" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 400 L420 400" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 400 L420 400" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="594" y="188" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="617.0" y="205" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">F+</text>
<circle cx="640" cy="200" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="592" y="232" width="48" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="616.0" y="249" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">RTD+</text>
<circle cx="640" cy="244" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="592" y="276" width="48" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="616.0" y="293" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">RTD-</text>
<circle cx="640" cy="288" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="594" y="320" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="617.0" y="337" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">F-</text>
<circle cx="640" cy="332" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="730" y="150" width="200" height="240" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="830.0" y="174" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">PT1000 Probe</text>
<text x="830.0" y="194" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">3 wires (2 the same color)</text>
<text x="830" y="230" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">the odd-color wire</text>
<text x="830" y="250" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">on one side,</text>
<text x="830" y="280" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">the 2 same-color wires</text>
<text x="830" y="300" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">on the other side:</text>
<text x="830" y="330" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">follow the board</text>
<text x="830" y="350" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">maker's 3-wire picture</text>
<path d="M660 190 L700 190 L700 370 L660 370" fill="none" stroke="#555" stroke-width="2.5"/>
<path d="M700 280 L730 280" fill="none" stroke="#555" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="530" y="460" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Set the board's solder jumpers for 3 wires</text>
<text x="530" y="480" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">(the board maker's guide shows which)</text>
<line x1="30" y1="535" x2="60" y2="535" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="540" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="535" x2="147.6" y2="535" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="540" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<line x1="205.2" y1="535" x2="235.2" y2="535" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
<text x="243.2" y="540" font-size="13" text-anchor="start" fill="#333" font-weight="normal">clock</text>
<line x1="307.2" y1="535" x2="337.2" y2="535" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
<text x="345.2" y="540" font-size="13" text-anchor="start" fill="#333" font-weight="normal">data out</text>
<line x1="430.79999999999995" y1="535" x2="460.79999999999995" y2="535" stroke="#6a1b9a" stroke-width="5" stroke-linecap="round"/>
<text x="468.79999999999995" y="540" font-size="13" text-anchor="start" fill="#333" font-weight="normal">data in</text>
<line x1="547.1999999999999" y1="535" x2="577.1999999999999" y2="535" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="585.1999999999999" y="540" font-size="13" text-anchor="start" fill="#333" font-weight="normal">CS (its own)</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">PT1000 RTD Probe on a MAX31865 Board</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega SPI Ports D50, D51, D52 (shared) + its own CS Port D48   ·   board reference resistor 4300 ohm</text>
<rect x="0" y="560" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="586" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
