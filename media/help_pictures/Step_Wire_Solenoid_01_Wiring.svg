<line x1="270.0" y1="595" x2="300.0" y2="595" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="308.0" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND (-)</text>
<line x1="386.4" y1="595" x2="416.4" y2="595" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="424.4" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">control Port</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Water Solenoid Valve</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega Port  &gt;  relay  &gt;  solenoid coil, with a 1N4007 diode across the coil</text>
<rect x="0" y="600" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="626" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
