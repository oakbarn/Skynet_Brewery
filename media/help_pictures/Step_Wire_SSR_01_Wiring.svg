<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): SSR (Solid State Relay), DC in, AC out. A general method only, not a wiring plan. -->
<rect width="960" height="600" fill="#ffffff"/>
<rect x="30" y="110" width="200" height="200" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="130.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="130.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="184" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">5V</text>
<circle cx="230" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="184" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D23</text>
<circle cx="230" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="370" y="110" width="220" height="260" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2.5"/>
<text x="480.0" y="134" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">SSR (DA type)</text>
<text x="480.0" y="154" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">on its Heat Sink</text>
<rect x="370" y="178" width="57" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="398.5" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">3 (+)</text>
<circle cx="370" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="370" y="222" width="57" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="398.5" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">4 (-)</text>
<circle cx="370" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="544" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="567.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">1</text>
<circle cx="590" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="544" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="567.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">2</text>
<circle cx="590" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<text x="480" y="300" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">input: 3-32 V DC</text>
<text x="480" y="320" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">output: AC load</text>
<g><rect x="385" y="335" width="10" height="28" fill="#90a4ae"/><rect x="405" y="335" width="10" height="28" fill="#90a4ae"/><rect x="425" y="335" width="10" height="28" fill="#90a4ae"/><rect x="445" y="335" width="10" height="28" fill="#90a4ae"/><rect x="465" y="335" width="10" height="28" fill="#90a4ae"/><rect x="485" y="335" width="10" height="28" fill="#90a4ae"/><rect x="505" y="335" width="10" height="28" fill="#90a4ae"/><rect x="525" y="335" width="10" height="28" fill="#90a4ae"/><rect x="545" y="335" width="10" height="28" fill="#90a4ae"/><rect x="565" y="335" width="10" height="28" fill="#90a4ae"/></g>
<path d="M230 190 L300 190 L300 190 L370 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L320 234 L320 234 L370 234" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L320 234 L320 234 L370 234" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="650" y="90" width="280" height="380" rx="10" fill="#fff" stroke="#d01818" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="790.0" y="114" font-size="16" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ AC side</text>
<text x="790.0" y="134" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">Licensed Electrician only</text>
<rect x="700" y="150" width="200" height="60" rx="10" fill="#ffebee" stroke="#333" stroke-width="2.5"/>
<text x="800.0" y="174" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Hot (L) from GFCI</text>
<rect x="700" y="260" width="200" height="60" rx="10" fill="#ffebee" stroke="#333" stroke-width="2.5"/>
<text x="800.0" y="284" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Pump or Element</text>
<rect x="700" y="360" width="200" height="60" rx="10" fill="#ffebee" stroke="#333" stroke-width="2.5"/>
<text x="800.0" y="384" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Neutral (N)</text>
<path d="M590 190 L640 190 L700 190" fill="none" stroke="#795548" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M590 234 L640 234 L640 290 L700 290" fill="none" stroke="#795548" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M800 320 L800 360" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="470" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">The SSR switches only the Hot wire.</text>
<text x="470" y="442" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">Ground and Neutral go straight to the load.</text>
<line x1="30" y1="545" x2="60" y2="545" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="545" x2="147.6" y2="545" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">control Port</text>
<line x1="270.0" y1="545" x2="300.0" y2="545" stroke="#795548" stroke-width="5" stroke-linecap="round"/>
<text x="308.0" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">AC Hot (switched)</text>
<line x1="458.4" y1="545" x2="488.4" y2="545" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
<text x="496.4" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">AC Neutral</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">SSR (Solid State Relay), DC in, AC out</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega 5V  &gt;  SSR input (+)   ·   SSR input (-)  &gt;  Port D23   (On = the Port goes LOW)</text>
<rect x="0" y="560" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="586" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
