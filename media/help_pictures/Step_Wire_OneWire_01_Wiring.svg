<text x="145.0" y="444" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">best: its own supply</text>
<rect x="212" y="454" width="48" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="236.0" y="471" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">+5 V</text>
<circle cx="260" cy="466" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="214" y="488" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="237.0" y="505" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">-V</text>
<circle cx="260" cy="500" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<text x="145" y="545" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">(or the Mega's 5V for a few probes)</text>
