<path d="M380 135.0 L380 145.0 L370 150.0 L390 156.0 L370 162.0 L390 168.0 L370 174.0 L390 180.0 L380 185.0 L380 195.0" fill="none" stroke="#5d4037" stroke-width="3.5" stroke-linejoin="round"/>
<text x="402" y="170.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">4.7k ohm pull-up</text>
<path d="M380 140 L380 135.0" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380 195.0 L380 190" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M380 195.0 L380 190" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="380" cy="140" r="6" fill="#212121"/>
<circle cx="380" cy="190" r="6" fill="#212121"/>
<text x="330" y="262" font-size="12" text-anchor="start" fill="#555" font-weight="normal">one per bus, at the Mega end</text>
<rect x="500" y="380" width="120" height="100" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="560.0" y="404" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Probe 1</text>
<text x="560.0" y="424" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">DS18B20</text>
<path d="M530 140 L530 380" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="530" cy="140" r="6" fill="#212121"/>
<path d="M560 190 L560 380" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M560 190 L560 380" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="560" cy="190" r="6" fill="#212121"/>
<path d="M590 234 L590 380" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="590" cy="234" r="6" fill="#212121"/>
<rect x="650" y="380" width="120" height="100" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="710.0" y="404" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Probe 2</text>
<text x="710.0" y="424" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">DS18B20</text>
<path d="M680 140 L680 380" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="680" cy="140" r="6" fill="#212121"/>
<path d="M710 190 L710 380" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M710 190 L710 380" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="710" cy="190" r="6" fill="#212121"/>
<path d="M740 234 L740 380" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="740" cy="234" r="6" fill="#212121"/>
<rect x="800" y="380" width="120" height="100" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="860.0" y="404" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Probe 3</text>
<text x="860.0" y="424" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">DS18B20</text>
<path d="M830 140 L830 380" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="830" cy="140" r="6" fill="#212121"/>
<path d="M860 190 L860 380" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M860 190 L860 380" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="860" cy="190" r="6" fill="#212121"/>
<path d="M890 234 L890 380" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="890" cy="234" r="6" fill="#212121"/>
<text x="710" y="510" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">one cable from probe to probe (daisy chain), short branches</text>
<text x="710" y="530" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">red = 5 V   ·   yellow (or white) = data   ·   black = GND (check your probe)</text>
<line x1="30" y1="585" x2="60" y2="585" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="590" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V (probes and pull-up)</text>
<line x1="268.8" y1="585" x2="298.8" y2="585" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="306.8" y="590" font-size="13" text-anchor="start" fill="#333" font-weight="normal">data (D40)</text>
<line x1="406.8" y1="585" x2="436.8" y2="585" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="444.8" y="590" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND (all joined)</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">1-Wire (OneWire) DS18B20 Probes</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Daisy chained on 3 wires: 5 V, GND and data on D40, one 4.7k ohm pull-up resistor (no parasite mode)</text>
<rect x="0" y="600" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="626" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
