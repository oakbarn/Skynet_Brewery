<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): Switches and Float Switches. A general method only, not a wiring plan. -->
<rect width="960" height="520" fill="#ffffff"/>
<rect x="40" y="110" width="200" height="260" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="140.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="140.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="194" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D32</text>
<circle cx="240" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="194" y="288" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="305" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="240" cy="300" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="560" y="110" width="300" height="250" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="710.0" y="134" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Switch, Float Switch,</text>
<text x="710.0" y="154" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">Push Button, Leak Sensor ...</text>
<rect x="560" y="178" width="66" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="593.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">wire 1</text>
<circle cx="560" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="560" y="288" width="66" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="593.0" y="305" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">wire 2</text>
<circle cx="560" cy="300" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M240 190 L560 190" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 190 L560 190" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 300 L560 300" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="450" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">Closed = ON in Skynet. Low voltage only: never wire a switch to AC.</text>
<line x1="30" y1="470" x2="60" y2="470" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">Port (D32)</text>
<line x1="168.0" y1="470" x2="198.0" y2="470" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="206.0" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Switches and Float Switches</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">A switch between the Port and GND: nothing else (the board's pull-up is On)</text>
<rect x="0" y="480" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="506" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
