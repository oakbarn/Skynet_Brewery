<text x="155.6" y="510" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<line x1="205.2" y1="505" x2="235.2" y2="505" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
<text x="243.2" y="510" font-size="13" text-anchor="start" fill="#333" font-weight="normal">SDA (data)</text>
<line x1="343.2" y1="505" x2="373.2" y2="505" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
<text x="381.2" y="510" font-size="13" text-anchor="start" fill="#333" font-weight="normal">SCL (clock)</text>
<line x1="488.4" y1="505" x2="518.4" y2="505" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="526.4" y="510" font-size="13" text-anchor="start" fill="#333" font-weight="normal">sensor signal</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">ADS1115 Analog Board (I2C)</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega SDA D20 and SCL D21, 5V, GND  ·  sensors on A0-A3 of the ADS1115</text>
<rect x="0" y="520" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="546" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
