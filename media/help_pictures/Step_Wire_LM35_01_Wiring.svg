<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): LM35 or TMP36 Temperature Sensor. A general method only, not a wiring plan. -->
<rect width="960" height="520" fill="#ffffff"/>
<rect x="40" y="110" width="200" height="260" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="140.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="140.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="194" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">5V</text>
<circle cx="240" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="194" y="238" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="255" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">A1</text>
<circle cx="240" cy="250" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="194" y="298" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="315" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="240" cy="310" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="600" y="150" width="260" height="200" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="730.0" y="174" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">LM35 or TMP36</text>
<text x="730.0" y="194" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(flat face toward you)</text>
<rect x="600" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="623.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">+Vs</text>
<circle cx="600" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="600" y="238" width="48" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="624.0" y="255" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Vout</text>
<circle cx="600" cy="250" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="600" y="298" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="623.0" y="315" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="600" cy="310" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M240 190 L600 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 250 L600 250" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 250 L600 250" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 310 L600 310" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="450" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">Check the pin order on your sensor's data sheet: a reversed sensor gets hot.</text>
<line x1="30" y1="470" x2="60" y2="470" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="470" x2="147.6" y2="470" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">signal (A1)</text>
<line x1="262.79999999999995" y1="470" x2="292.79999999999995" y2="470" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="300.79999999999995" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">LM35 or TMP36 Temperature Sensor</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Three wires: 5V, signal to A1, GND</text>
<rect x="0" y="480" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="506" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
