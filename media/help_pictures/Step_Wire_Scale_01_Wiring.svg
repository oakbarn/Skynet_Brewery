<rect x="0" y="540" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="566" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
