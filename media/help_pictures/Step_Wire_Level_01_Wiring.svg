<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): Level Transmitter (4-20 mA). A general method only, not a wiring plan. -->
<rect width="960" height="640" fill="#ffffff"/>
<rect x="30" y="110" width="200" height="260" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="130.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="130.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="184" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">A3</text>
<circle cx="230" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="184" y="288" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="305" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="230" cy="300" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="640" y="120" width="280" height="200" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="780.0" y="144" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Level Transmitter</text>
<text x="780.0" y="164" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(2 wire, 4-20 mA)</text>
<rect x="874" y="258" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="897.0" y="275" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">+</text>
<circle cx="920" cy="270" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="640" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="663.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">-</text>
<circle cx="640" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M640 190 L230 190" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M640 190 L230 190" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="420" cy="190" r="6" fill="#212121"/>
<path d="M420 190 L420 215" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M420 190 L420 215" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="404" y="221.0" width="32" height="48" fill="#fff" stroke="none"/>
<path d="M420 215.0 L420 225.0 L410 230.0 L430 236.0 L410 242.0 L430 248.0 L410 254.0 L430 260.0 L420 265.0 L420 275.0" fill="none" stroke="#5d4037" stroke-width="3.5" stroke-linejoin="round"/>
<text x="442" y="250.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">250 ohm</text>
<path d="M420 275 L420 300" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 300 L560 300" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="420" cy="300" r="6" fill="#212121"/>
<rect x="640" y="400" width="220" height="110" rx="10" fill="#eceff1" stroke="#333" stroke-width="2.5"/>
<text x="750.0" y="424" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">24 V DC Power Supply</text>
<text x="750.0" y="444" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(for the transmitter)</text>
<rect x="814" y="454" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="837.0" y="471" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">+V</text>
<circle cx="860" cy="466" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="814" y="484" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="837.0" y="501" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">-V</text>
<circle cx="860" cy="496" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M860 466 L950 466 L950 270 L920 270" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M860 496 L940 496 L940 540 L560 540 L560 300" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="560" cy="300" r="6" fill="#212121"/>
<line x1="30" y1="590" x2="60" y2="590" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="595" font-size="13" text-anchor="start" fill="#333" font-weight="normal">+24 V</text>
<line x1="132.0" y1="590" x2="162.0" y2="590" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="170.0" y="595" font-size="13" text-anchor="start" fill="#333" font-weight="normal">loop to A3</text>
<line x1="270.0" y1="590" x2="300.0" y2="590" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="308.0" y="595" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND (-)</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Level Transmitter (4-20 mA)</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">24 V  &gt;  transmitter  &gt;  A3, with a 250 ohm resistor from A3 to GND</text>
<rect x="0" y="600" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="626" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
