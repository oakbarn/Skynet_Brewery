<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="430" viewBox="0 0 1040 430">
<!-- Skynet's own drawing (Help picture, Rule 7.25): the picture is Pump_Daisy_Chain_Art.png with its words taken out; the words are real text
     here, so they stay sharp and show in the Help language (help/<lang>/_pictures.json). It is used in place of Pump_Daisy_Chain.png. -->
<title>The Daisy Chain: how the Brain turns on the Red Pump</title>
<image href="Pump_Daisy_Chain_Art.png" x="0" y="0" width="1040" height="430"/>
<g font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" text-anchor="middle">
<text x="519.5" y="20.2" font-size="19.9" font-weight="bold" fill="#000000">The Daisy Chain: how the Brain turns on the Red Pump</text>
<text x="649.5" y="44.8" font-size="10.9" font-weight="bold" fill="#000000">120 VAC in and out</text>
<text x="649.5" y="230.8" font-size="10.9" font-weight="bold" fill="#c00000">Trigger from Port 15</text>
<text x="259.5" y="239.6" font-size="13.4" font-weight="bold" fill="#000000">WiFi, Ethernet</text>
<text x="259.5" y="254.9" font-size="12.4" font-weight="bold" fill="#000000">or USB</text>
<text x="520" y="239.6" font-size="13.4" font-weight="bold" fill="#c00000">5 V or 3.3 V</text>
<text x="519.5" y="256.0" font-size="13.9" font-weight="bold" fill="#c00000">trigger</text>
<text x="779.5" y="239.2" font-size="12.9" font-weight="bold" fill="#000000">120 VAC</text>
<text x="779.5" y="255.0" font-size="13.4" font-weight="bold" fill="#000000">power</text>
<text x="129.5" y="298.5" font-size="20.2" font-weight="bold" fill="#000000">Brain</text>
<text x="130" y="325.0" font-size="15.4" fill="#000000">PC or Raspberry Pi</text>
<text x="389.5" y="298.8" font-size="20.7" font-weight="bold" fill="#000000">Arduino</text>
<text x="389.5" y="325.4" font-size="15.9" fill="#000000">Interface BM</text>
<text x="389.5" y="347.5" font-size="14.7" font-weight="bold" fill="#c00000">Port 15</text>
<text x="650" y="299.0" font-size="20.9" font-weight="bold" fill="#000000">SSR or Contactor</text>
<text x="649.5" y="326.0" font-size="15.4" fill="#000000">Hook the 120 VAC here</text>
<text x="909.5" y="298.8" font-size="20.7" font-weight="bold" fill="#000000">Red Pump</text>
<text x="910" y="325.0" font-size="15.4" fill="#000000">Blichmann RipTide</text>
<text x="910" y="347.7" font-size="14.9" font-weight="bold" fill="#c00000">Gets Power</text>
<text x="519" y="416.9" font-size="15.2" font-weight="bold" fill="#c00000">⚠ Electricity can kill. Consult a Licensed Electrician.</text>
</g>
</svg>
