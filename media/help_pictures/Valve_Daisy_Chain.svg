<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="431" viewBox="0 0 1040 431">
<!-- Skynet's own drawing (Help picture, Rule 7.25): the picture is Valve_Daisy_Chain_Art.png with its words taken out; the words are real text
     here, so they stay sharp and show in the Help language (help/<lang>/_pictures.json). It is used in place of Valve_Daisy_Chain.png. -->
<title>The Daisy Chain: how the Brain opens the Mash Valve</title>
<image href="Valve_Daisy_Chain_Art.png" x="0" y="0" width="1040" height="431"/>
<g font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" text-anchor="middle">
<text x="519.5" y="28.7" font-size="19.2" font-weight="bold" fill="#000000">The Daisy Chain: how the Brain opens the Mash Valve</text>
<text x="127.5" y="156.2" font-size="21.2" font-weight="bold" fill="#7a2a3d">Brain</text>
<text x="400" y="149.0" font-size="20.9" font-weight="bold" fill="#ffffff">MEGA 2560</text>
<text x="399.5" y="177.9" font-size="19.4" font-weight="bold" fill="#ffd54f">Port 15</text>
<text x="635" y="128.3" font-size="17.2" font-weight="bold" fill="#000000">Relay or SSR</text>
<text x="634.5" y="149.5" font-size="13.2" font-weight="bold" fill="#cc0000">Trigger from Port 15</text>
<text x="289.5" y="250.5" font-size="13.2" font-weight="bold" fill="#000000">WiFi, Ethernet or</text>
<text x="289.5" y="265.7" font-size="12.2" font-weight="bold" fill="#000000">USB</text>
<text x="550" y="250.6" font-size="13.4" font-weight="bold" fill="#cc0000">5 V or 3.3 V</text>
<text x="549.5" y="267.0" font-size="13.9" font-weight="bold" fill="#cc0000">trigger</text>
<text x="809.5" y="250.5" font-size="13.2" font-weight="bold" fill="#000000">12 V DC, 24 V or</text>
<text x="809.5" y="266.2" font-size="12.9" font-weight="bold" fill="#000000">120 VAC</text>
<text x="129.5" y="305.4" font-size="18.7" font-weight="bold" fill="#000000">Brain</text>
<text x="130" y="334.0" font-size="15.4" fill="#333333">PC or Raspberry Pi</text>
<text x="389" y="306.2" font-size="19.9" font-weight="bold" fill="#000000">Arduino</text>
<text x="389.5" y="334.4" font-size="15.9" fill="#333333">Interface BM</text>
<text x="389.5" y="357.5" font-size="14.7" font-weight="bold" fill="#cc0000">Port 15</text>
<text x="650" y="306.7" font-size="19.2" font-weight="bold" fill="#000000">Relay or SSR</text>
<text x="649.5" y="335.4" font-size="15.9" fill="#333333">Hook the Valve's power here</text>
<text x="909.5" y="307.8" font-size="20.7" font-weight="bold" fill="#000000">Mash Valve</text>
<text x="909.5" y="334.2" font-size="15.7" fill="#333333">Skynet Motorized Ball Valve</text>
<text x="909.5" y="357.9" font-size="15.2" font-weight="bold" fill="#cc0000">Gets Power and Opens</text>
<text x="519" y="425.9" font-size="15.2" font-weight="bold" fill="#cc0000">⚠ Electricity can kill. Consult a Licensed Electrician.</text>
</g>
</svg>
