<path d="M250 515 L340 515 L340 364 L380 364" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M340 364 L340 244" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="340" cy="364" r="6" fill="#212121"/>
<circle cx="340" cy="244" r="6" fill="#212121"/>
<text x="165" y="590" font-size="14" text-anchor="start" fill="#333" font-weight="bold">All GND (-) wires join: Mega GND = module GND = supply -V</text>
<path d="M600 180 L645 180 L645 200 L690 200" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 224 L660 224 L660 244 L690 244" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M810 320 L810 380" fill="none" stroke="#9e9e9e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/>
<line x1="30" y1="562" x2="60" y2="562" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="567" font-size="13" text-anchor="start" fill="#333" font-weight="normal">PWM signal</text>
<line x1="168.0" y1="562" x2="198.0" y2="562" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
<text x="206.0" y="567" font-size="13" text-anchor="start" fill="#333" font-weight="normal">0-10 V signal</text>
<line x1="327.6" y1="562" x2="357.6" y2="562" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="365.6" y="567" font-size="13" text-anchor="start" fill="#333" font-weight="normal">+24 V</text>
<line x1="429.6" y1="562" x2="459.6" y2="562" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="467.6" y="567" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND (-)</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">DAC: PWM to 0-10 V Module</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega True PWM Port D44  &gt;  PWM to 0-10 V Module  &gt;  0-10 V Power Controller</text>
<rect x="0" y="600" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="626" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
