<text x="810.0" y="424" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">GFCI power, element:</text>
<text x="810" y="450" font-size="14" text-anchor="middle" fill="#d01818" font-weight="bold">Licensed Electrician</text>
<text x="810" y="474" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">only (not drawn here)</text>
<path d="M230 200 L300 200 L300 180 L380 180" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
