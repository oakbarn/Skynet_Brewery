<rect x="380" y="308" width="84" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="422.0" y="325" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">VCC 24 V</text>
<circle cx="380" cy="320" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="380" y="352" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="403.0" y="369" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="380" cy="364" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="552" y="168" width="48" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="576.0" y="185" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">VOUT</text>
<circle cx="600" cy="180" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="554" y="212" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="577.0" y="229" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="600" cy="224" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
