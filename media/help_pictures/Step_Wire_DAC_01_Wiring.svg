<rect x="690" y="188" width="84" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="732.0" y="205" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">0-10 V +</text>
