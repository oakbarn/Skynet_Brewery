<rect x="690" y="232" width="84" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="732.0" y="249" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">0-10 V -</text>
<circle cx="690" cy="244" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="690" y="380" width="240" height="150" rx="10" fill="#fff" stroke="#d01818" stroke-width="2.5" stroke-dasharray="8 6"/>
