<text x="130.0" y="164" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="137" y="188" width="93" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="183.5" y="205" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D44 (PWM)</text>
