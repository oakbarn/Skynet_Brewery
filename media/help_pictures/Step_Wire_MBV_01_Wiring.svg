<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): Motorized Ball Valve (one control wire). A general method only, not a wiring plan. -->
<rect width="960" height="640" fill="#ffffff"/>
<rect x="30" y="110" width="200" height="200" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="130.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="130.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="184" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">5V</text>
<circle cx="230" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="184" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D24</text>
<circle cx="230" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="330" y="100" width="200" height="200" rx="10" fill="#e8f5e9" stroke="#333" stroke-width="2.5"/>
<text x="430.0" y="124" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Relay Module</text>
<text x="430.0" y="144" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(one channel)</text>
<rect x="330" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="353.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">VCC</text>
<circle cx="330" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="330" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="353.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">IN</text>
<circle cx="330" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="484" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="507.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">COM</text>
<circle cx="530" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="484" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="507.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">NO</text>
<circle cx="530" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 190 L330 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L330 234" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L330 234" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="430" y="285" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">(and GND to GND)</text>
<rect x="30" y="400" width="220" height="110" rx="10" fill="#eceff1" stroke="#333" stroke-width="2.5"/>
<text x="140.0" y="424" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">12 V DC Power Supply</text>
<text x="140.0" y="444" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(or 24 V: the valve's volts)</text>
<rect x="204" y="454" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="227.0" y="471" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">+V</text>
<circle cx="250" cy="466" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="204" y="484" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="227.0" y="501" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">-V</text>
<circle cx="250" cy="496" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="670" y="130" width="260" height="260" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="800.0" y="154" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Motorized Ball Valve</text>
<text x="800.0" y="174" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">3 wires (see its label)</text>
<rect x="670" y="198" width="75" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="707.5" y="215" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">power +</text>
<circle cx="670" cy="210" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="670" y="258" width="75" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="707.5" y="275" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">control</text>
<circle cx="670" cy="270" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="670" y="318" width="57" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="698.5" y="335" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND -</text>
<circle cx="670" cy="330" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M250 466 L300 466 L300 360 L560 360 L560 190 L530 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M560 210 L600 210 L670 210" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="560" cy="210" r="6" fill="#212121"/>
<path d="M530 234 L580 234 L580 270 L670 270" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250 496 L620 496 L620 330 L670 330" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="800" y="420" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">control on = OPEN</text>
<text x="800" y="440" font-size="13" text-anchor="middle" fill="#333" font-weight="normal">control off = CLOSED</text>
<line x1="30" y1="595" x2="60" y2="595" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">+12 V</text>
<line x1="132.0" y1="595" x2="162.0" y2="595" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/>
<text x="170.0" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">switched control</text>
<line x1="313.2" y1="595" x2="343.2" y2="595" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="351.2" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND (-)</text>
<line x1="429.6" y1="595" x2="459.6" y2="595" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="467.6" y="600" font-size="13" text-anchor="start" fill="#333" font-weight="normal">control Port</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Motorized Ball Valve (one control wire)</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega Port  &gt;  relay  &gt;  the valve's control wire  ·  12 V always on to its power wire</text>
<rect x="0" y="600" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="626" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
