<line x1="307.2" y1="545" x2="337.2" y2="545" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
<text x="345.2" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">data out</text>
<line x1="430.79999999999995" y1="545" x2="460.79999999999995" y2="545" stroke="#6a1b9a" stroke-width="5" stroke-linecap="round"/>
<text x="468.79999999999995" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">data in</text>
<line x1="547.1999999999999" y1="545" x2="577.1999999999999" y2="545" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="585.1999999999999" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">CS (its own)</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Thermocouple on a MAX31856 or MAX31855 Board</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega SPI Ports D50, D51, D52 (shared) + its own CS Port D49</text>
<rect x="0" y="560" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="586" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
