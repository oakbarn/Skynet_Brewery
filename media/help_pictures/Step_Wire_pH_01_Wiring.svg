<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): pH Probe and pH Board. A general method only, not a wiring plan. -->
<rect width="960" height="520" fill="#ffffff"/>
<rect x="40" y="110" width="200" height="260" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="140.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="140.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="194" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">5V</text>
<circle cx="240" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="194" y="238" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="255" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">A5</text>
<circle cx="240" cy="250" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="194" y="298" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="315" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="240" cy="310" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="420" y="140" width="230" height="220" rx="10" fill="#f3e5f5" stroke="#333" stroke-width="2.5"/>
<text x="535.0" y="164" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">pH Board</text>
<text x="535.0" y="184" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(0-5 V out)</text>
<rect x="420" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">V+</text>
<circle cx="420" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="420" y="238" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="255" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Po</text>
<circle cx="420" cy="250" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="420" y="298" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="443.0" y="315" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">G</text>
<circle cx="420" cy="310" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M240 190 L420 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 250 L420 250" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 250 L420 250" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 310 L420 310" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="604" y="238" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="627.0" y="255" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">BNC</text>
<circle cx="650" cy="250" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="740" y="180" width="190" height="140" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="835.0" y="204" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">pH Probe</text>
<text x="835.0" y="224" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(BNC plug)</text>
<path d="M650 250 L740 250" fill="none" stroke="#757575" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="480" y="410" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">Calibrate with pH 7 and pH 4 buffer (two-point) before brewing.</text>
<line x1="30" y1="470" x2="60" y2="470" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="470" x2="147.6" y2="470" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">signal (A5)</text>
<line x1="262.79999999999995" y1="470" x2="292.79999999999995" y2="470" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="300.79999999999995" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<line x1="350.4" y1="470" x2="380.4" y2="470" stroke="#757575" stroke-width="5" stroke-linecap="round"/>
<text x="388.4" y="475" font-size="13" text-anchor="start" fill="#333" font-weight="normal">probe cable</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">pH Probe and pH Board</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">pH probe (BNC)  &gt;  pH board  &gt;  Mega 5V, GND, A5</text>
<rect x="0" y="480" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="506" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
