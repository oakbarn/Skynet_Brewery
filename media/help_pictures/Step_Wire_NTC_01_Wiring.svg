<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): 10K NTC Thermistor Probe. A general method only, not a wiring plan. -->
<rect width="960" height="540" fill="#ffffff"/>
<rect x="40" y="110" width="200" height="340" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="140.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="140.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="194" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">5V</text>
<circle cx="240" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="194" y="288" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="305" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">A0</text>
<circle cx="240" cy="300" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="194" y="398" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="217.0" y="415" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="240" cy="410" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M240 190 L420 190 L420 215.0" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M420 275.0 L420 300" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M420 275.0 L420 300" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="404" y="221.0" width="32" height="48" fill="#fff" stroke="none"/>
<path d="M420 215.0 L420 225.0 L410 230.0 L430 236.0 L410 242.0 L430 248.0 L410 254.0 L430 260.0 L420 265.0 L420 275.0" fill="none" stroke="#5d4037" stroke-width="3.5" stroke-linejoin="round"/>
<text x="442" y="250.0" font-size="14" text-anchor="start" fill="#000" font-weight="bold">10k ohm resistor</text>
<text x="442" y="269.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal">(the same size as the probe)</text>
<rect x="620" y="250" width="290" height="200" rx="10" fill="#e3f2fd" stroke="#333" stroke-width="2.5"/>
<text x="765.0" y="274" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">10K NTC Probe</text>
<text x="765.0" y="294" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">2 wires, either way round</text>
<rect x="620" y="288" width="66" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="653.0" y="305" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">wire 1</text>
<circle cx="620" cy="300" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="620" y="398" width="66" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="653.0" y="415" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">wire 2</text>
<circle cx="620" cy="410" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M240 300 L620 300" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 300 L620 300" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="420" cy="300" r="6" fill="#212121"/>
<path d="M240 410 L620 410" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="765" y="430" font-size="13" text-anchor="middle" fill="#555" font-weight="normal" font-style="italic">stainless tip in a Thermowell</text>
<line x1="30" y1="490" x2="60" y2="490" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="495" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="490" x2="147.6" y2="490" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="495" font-size="13" text-anchor="start" fill="#333" font-weight="normal">signal (A0)</text>
<line x1="262.79999999999995" y1="490" x2="292.79999999999995" y2="490" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="300.79999999999995" y="495" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">10K NTC Thermistor Probe</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega 5V  &gt;  10k ohm resistor  &gt;  A0  &gt;  probe  &gt;  GND</text>
<rect x="0" y="500" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="526" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
