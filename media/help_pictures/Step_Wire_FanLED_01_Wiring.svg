<text x="630" y="380" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">switched 12 V</text>
<line x1="30" y1="545" x2="60" y2="545" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="545" x2="147.6" y2="545" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">Ports</text>
<line x1="219.6" y1="545" x2="249.6" y2="545" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/>
<text x="257.6" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">switched power</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Fan, Buzzer or LED</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">A small LED on the Port with a resistor  ·  a fan or buzzer through a relay or MOSFET</text>
<rect x="0" y="560" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="586" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
