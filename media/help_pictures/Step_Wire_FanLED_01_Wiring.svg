<text x="560" y="196" font-size="13" text-anchor="start" fill="#333" font-weight="normal">On = D41 goes LOW: the LED lights</text>
<rect x="380" y="320" width="200" height="140" rx="10" fill="#e8f5e9" stroke="#333" stroke-width="2.5"/>
<text x="480.0" y="344" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Relay Module</text>
<text x="480.0" y="364" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">or MOSFET module</text>
<text x="480" y="440" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">(and 5V, GND to VCC, GND)</text>
<rect x="380" y="388" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="403.0" y="405" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">IN</text>
