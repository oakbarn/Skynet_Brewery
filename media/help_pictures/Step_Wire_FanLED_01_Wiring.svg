<path d="M230 190 L320 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="326" y="174" width="48" height="32" fill="#fff" stroke="none"/>
<path d="M320 190 L330 190 L335 180 L341 200 L347 180 L353 200 L359 180 L365 200 L370 190 L380 190" fill="none" stroke="#5d4037" stroke-width="3.5" stroke-linejoin="round"/>
<text x="350" y="172" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">330 ohm</text>
<path d="M380 190 L440 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="465" cy="190" r="20" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3"/>
<text x="465" y="195" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">LED</text>
<text x="440" y="162" font-size="12" text-anchor="end" fill="#333" font-weight="normal">long leg</text>
<text x="490" y="162" font-size="12" text-anchor="start" fill="#333" font-weight="normal">short leg</text>
<path d="M485 190 L540 190 L540 250 L300 250 L300 234 L230 234" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
