<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): Relay Board (Relay Module). A general method only, not a wiring plan. -->
<rect width="960" height="600" fill="#ffffff"/>
<rect x="30" y="110" width="200" height="230" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="130.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="130.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="184" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">5V</text>
<circle cx="230" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="184" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="230" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="184" y="266" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="283" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D22</text>
<circle cx="230" cy="278" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="380" y="100" width="230" height="270" rx="10" fill="#e8f5e9" stroke="#333" stroke-width="2.5"/>
<text x="495.0" y="124" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Relay Module</text>
<text x="495.0" y="144" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(opto-isolated, 5 V)</text>
<rect x="380" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="403.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">VCC</text>
<circle cx="380" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="380" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="403.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="380" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="380" y="266" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="403.0" y="283" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">IN1</text>
<circle cx="380" cy="278" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="564" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="587.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">COM</text>
<circle cx="610" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="564" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="587.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">NO</text>
<circle cx="610" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="564" y="266" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="587.0" y="283" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">NC</text>
<circle cx="610" cy="278" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<text x="495" y="340" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">NC: not used here</text>
<path d="M230 190 L380 190" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L380 234" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 278 L380 278" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 278 L380 278" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="700" y="110" width="230" height="110" rx="10" fill="#eceff1" stroke="#333" stroke-width="2.5"/>
<text x="815.0" y="134" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Load power</text>
<text x="815.0" y="154" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(DC supply, or AC for a pump)</text>
<rect x="700" y="260" width="230" height="110" rx="10" fill="#ffebee" stroke="#333" stroke-width="2.5"/>
<text x="815.0" y="284" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">Pump, valve or light</text>
<text x="815.0" y="304" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">(the load)</text>
<path d="M610 190 L660 190 L660 165 L700 165" fill="none" stroke="#795548" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M610 234 L680 234 L680 315 L700 315" fill="none" stroke="#795548" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M815 220 L815 260" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="480" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">The relay closes COM to NO while the Device is On.</text>
<text x="480" y="442" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">The Mega turns D22 On by pulling it LOW, which is what most relay boards want.</text>
<text x="480" y="474" font-size="14" text-anchor="middle" fill="#d01818" font-weight="bold">On AC (a pump plug, a light): a Licensed Electrician wires the COM and NO side.</text>
<line x1="30" y1="545" x2="60" y2="545" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="117.6" y1="545" x2="147.6" y2="545" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<line x1="205.2" y1="545" x2="235.2" y2="545" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="243.2" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">control Port</text>
<line x1="357.6" y1="545" x2="387.6" y2="545" stroke="#795548" stroke-width="5" stroke-linecap="round"/>
<text x="395.6" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">switched power</text>
<line x1="524.4000000000001" y1="545" x2="554.4000000000001" y2="545" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
<text x="562.4000000000001" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">return</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">Relay Board (Relay Module)</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Mega 5V, GND and a Port  &gt;  relay IN  ·  the relay's contacts switch the load</text>
<rect x="0" y="560" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="586" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
