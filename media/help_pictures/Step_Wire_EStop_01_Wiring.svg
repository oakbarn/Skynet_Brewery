<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Skynet drawing (MIT, OakBarn Brewery 2026-11-19): E-Stop (Emergency Stop). A general method only, not a wiring plan. -->
<rect width="960" height="600" fill="#ffffff"/>
<rect x="30" y="110" width="200" height="200" rx="10" fill="#00878f" stroke="#00565b" stroke-width="2.5"/>
<text x="130.0" y="134" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Arduino Mega 2560</text>
<text x="130.0" y="154" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">the standard Skynet board</text>
<rect x="184" y="178" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">D31</text>
<circle cx="230" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="184" y="222" width="46" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="207.0" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">GND</text>
<circle cx="230" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="330" y="100" width="260" height="220" rx="10" fill="#ffebee" stroke="#333" stroke-width="2.5"/>
<text x="460.0" y="124" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">E-Stop button</text>
<text x="460.0" y="144" font-size="13" text-anchor="middle" fill="#000" font-weight="normal">mushroom, 2 contacts</text>
<rect x="452" y="178" width="138" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="521.0" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">contact 1 (NC)</text>
<circle cx="590" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="330" y="178" width="93" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="376.5" y="195" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">contact 2</text>
<circle cx="330" cy="190" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<rect x="330" y="222" width="93" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="376.5" y="239" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">contact 2</text>
<circle cx="330" cy="234" r="5" fill="#9e9e9e" stroke="#333" stroke-width="1.5"/>
<path d="M230 190 L330 190" fill="none" stroke="#8d6e00" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 190 L330 190" fill="none" stroke="#f9a825" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M230 234 L330 234" fill="none" stroke="#212121" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="640" y="90" width="290" height="380" rx="10" fill="#fff" stroke="#d01818" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="785.0" y="114" font-size="16" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ AC side</text>
<text x="785.0" y="138" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">contact 1 sits in the Main</text>
<text x="785.0" y="158" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">Contactor's coil wire:</text>
<text x="785.0" y="178" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">pressed = coil off =</text>
<text x="785.0" y="198" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">every heater and pump off</text>
<text x="785.0" y="218" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal"></text>
<text x="785.0" y="238" font-size="13" text-anchor="middle" fill="#d01818" font-weight="normal">Licensed Electrician only</text>
<path d="M590 190 L640 190" fill="none" stroke="#d01818" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/>
<text x="330" y="390" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">Contact 2 closed = not pressed. Pick it so pressing opens it (NC),</text>
<text x="330" y="412" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">then set Invert in the Port's attributes so pressed reads ON.</text>
<line x1="30" y1="545" x2="60" y2="545" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
<text x="68" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">D31</text>
<line x1="117.6" y1="545" x2="147.6" y2="545" stroke="#212121" stroke-width="5" stroke-linecap="round"/>
<text x="155.6" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<line x1="205.2" y1="545" x2="235.2" y2="545" stroke="#d01818" stroke-width="5" stroke-linecap="round"/>
<text x="243.2" y="550" font-size="13" text-anchor="start" fill="#333" font-weight="normal">AC coil wire</text>
<text x="480.0" y="32" font-size="22" text-anchor="middle" fill="#000" font-weight="bold">E-Stop (Emergency Stop)</text>
<text x="480.0" y="54" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Contact 1 (NC) cuts the Main Contactor's coil by itself  ·  contact 2 tells Skynet on D31</text>
<rect x="0" y="560" width="960" height="40" fill="#fff3f3"/>
<text x="480.0" y="586" font-size="13.5" text-anchor="middle" fill="#d01818" font-weight="bold">⚠ Electricity can kill. A general method only: it can't know your wiring. Check each part's own data sheet. Consult a Licensed Electrician.</text>
</svg>
