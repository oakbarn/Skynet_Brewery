# Panel version: every merge (push) to the default branch gets a version named PR<n>_<owner>-v.yyyymmdd_hh_mm,
# where PR<n> is the highest merged pull request number (for the time being, Fritz 2026-10-22),
# and <owner> is the GitHub user who owns this copy of the code. oakbarn's own copy says Skynet: PR85_Skynet-v.yyyymmdd_hh_mm.
# Someone else's copy (a fork) says their user name, for example PR3_brewer42-v.yyyymmdd_hh_mm.
# It writes version.json at the top of the panel (the panel shows it on the Menu Bar and in ☰ Menu > About),
# commits it back to the branch, and makes a GitHub tag and Release with the same name.
# The Release carries the Windows installer (Skynet_Brewer_Setup_<version>.exe), the panel zip, the add-only Skynet Media Setup
# .exe and zip (pictures and sounds, Rule 9.12), the add-only Sample Schemas Setup .exe and zip (Rule 9.13) and the install files,
# built by tools/build-release.sh, so anyone can download them from the Releases page without touching the code.
# Times are UTC. To use your own time zone, change TZ below (for example America/Chicago).
# Never edit version.json by hand or in a pull request: this workflow owns it.
# Signing: when the Azure Artifact Signing secrets and variables are set (docs/Code_Signing_Setup.md), the Setup .exe and
# the Uninstall .exe inside it are signed, so Windows Smart App Control lets them run. Until then (or if signing fails)
# the Setup .exe is built unsigned as before and the release still happens.
name: Panel version

on:
  push:
    branches: [claude/project-thread-vzxi0a]
    paths-ignore: [version.json]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  id-token: write   # lets this workflow sign in to Azure for signing without a stored password (OIDC)

concurrency:
  group: panel-version
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write version.json
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$OWNER" = "oakbarn" ]; then PREFIX="Skynet"; else PREFIX="$OWNER"; fi
          # the highest merged pull request number; if GitHub does not answer, the #number in the merge message
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&sort=created&direction=desc&per_page=100" \
            --jq '[.[] | select(.merged_at != null) | .number] | max // empty' 2>/dev/null || true)
          [ -n "$PR" ] || PR=$(git log -1 --format=%s | grep -o '#[0-9]\+' | head -1 | tr -d '#' || true)
          [ -n "$PR" ] && PREFIX="PR${PR}_$PREFIX"
          VERSION="$PREFIX-v.$(date +%Y%m%d_%H_%M)"
          # two merges in the same minute: add _2, _3 ...
          base="$VERSION"; n=2
          while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do VERSION="${base}_$n"; n=$((n+1)); done
          # the fingerprint of the program files, so the panel can tell when its files were changed after this merge
          CODE=$(node -e "import('./lib/auth.js').then(m => console.log(m.codeFingerprint('.')))")
          cat > version.json <<JSON
          {
            "version": "$VERSION",
            "merged": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "owner": "$OWNER",
            "commit": "${GITHUB_SHA}",
            "code": "$CODE",
            "repo": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}"
          }
          JSON
          cat version.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Panel version $VERSION [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git tag "$VERSION"
          git push origin "$VERSION"

      # ---- Signing (docs/Code_Signing_Setup.md). Every signing step is skipped until all six settings are filled in. ----
      - name: Is signing set up?
        id: signcheck
        env:
          C: ${{ secrets.AZURE_CLIENT_ID }}
          T: ${{ secrets.AZURE_TENANT_ID }}
          S: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E: ${{ vars.SIGNING_ENDPOINT }}
          A: ${{ vars.SIGNING_ACCOUNT }}
          P: ${{ vars.SIGNING_PROFILE }}
        run: |
          if [ -n "$C" ] && [ -n "$T" ] && [ -n "$S" ] && [ -n "$E" ] && [ -n "$A" ] && [ -n "$P" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"; echo "Signing is set up."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing is not set up yet, so the Setup .exe will not be signed (see docs/Code_Signing_Setup.md)."
          fi

      - name: Sign in to Azure (for signing)
        id: azlogin
        if: steps.signcheck.outputs.ready == 'true'
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get the signing tool and a signing pass
        if: steps.signcheck.outputs.ready == 'true' && steps.azlogin.outcome == 'success'
        continue-on-error: true
        env:
          E: ${{ vars.SIGNING_ENDPOINT }}
          A: ${{ vars.SIGNING_ACCOUNT }}
          P: ${{ vars.SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          # Jsign signs Windows .exe files on Linux (Apache License 2.0, https://ebourg.github.io/jsign)
          JAR="$RUNNER_TEMP/jsign-7.6.jar"
          curl -sSLf -o "$JAR" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  $JAR" | sha256sum -c -
          TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          {
            echo "SKYNET_SIGN_JAR=$JAR"
            echo "SKYNET_SIGN_ENDPOINT=$E"
            echo "SKYNET_SIGN_ACCOUNT=$A"
            echo "SKYNET_SIGN_PROFILE=$P"
            echo "SKYNET_SIGN_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      - name: Build the installer and zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis zip
          bash tools/build-release.sh "$VERSION"
          # one zip for the first-install folders, so the Release page stays short
          ( cd release && zip -qr "First_Install_ReadMes_$VERSION.zip" First_Install_* )

      - name: Make the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if grep -q "^signed Setup .exe" release/signing.log 2>/dev/null; then
            WARN="This installer is signed (Microsoft Artifact Signing). For the first few weeks Windows may still say *Windows protected your PC* while it learns the new signature: click **More info**, then **Run anyway**."
          else
            WARN="Windows may say *Windows protected your PC*: click **More info**, then **Run anyway** (this installer is not signed)."
          fi
          cat > notes.md <<NOTES
          **To install on Windows:** download \`Skynet_Brewer_Setup_$VERSION.exe\` below and double-click it. It makes \`C:\\Brewing\\BrewPanel\` and puts **Skynet Brewer** on the Desktop. $WARN

          **Mac, Linux, Raspberry Pi or by hand:** download \`Skynet_BrewPanel_$VERSION.zip\` and \`ReadMe.txt\`.

          **Pictures and sounds:** \`Skynet_Media_Setup_$VERSION.exe\` (Windows, run it after the Setup) or \`Skynet_Media_$VERSION.zip\`. They only add the ones you do not have: nothing you have is changed or deleted.

          **More Sample Schemas:** \`Skynet_Sample_Schemas_Setup_$VERSION.exe\` (Windows) or \`Skynet_Sample_Schemas_$VERSION.zip\`. The panel comes with the 3 Vessel sample; more samples are added here one at a time. Add-only, like the pictures and sounds.

          NOTES
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --generate-notes --latest \
            release/Skynet_Brewer_Setup_*.exe release/Skynet_BrewPanel_*.zip release/Skynet_Media_Setup_*.exe release/Skynet_Media_*.zip \
            release/Skynet_Sample_Schemas_Setup_*.exe release/Skynet_Sample_Schemas_*.zip release/ReadMe.txt \
            "release/Install Skynet Brewer.command" release/install-skynet-brewer.sh release/Skynet_Brewer.bat \
            release/First_Install_ReadMes_*.zip release/Minimum_Equipment_and_Limitations.txt

  # ---- Virus check (Rule 9.11): Microsoft Defender scans every .exe on the new Release, on a Windows computer at GitHub. ----
  # Clean: a "Virus check" line is added to the Release notes.
  # Anything found: the Release is turned back into a Draft (hidden from the public), this job turns red
  # and GitHub emails oakbarn. Nothing is deleted; look at it, then publish the Draft again or remove it.
  virus-check:
    needs: stamp
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stamp.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Get the .exe files from the Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scan | Out-Null
          gh release download $env:VERSION --pattern '*.exe' --dir scan
          Get-ChildItem scan | Format-Table Name, Length

      - name: Scan them with Microsoft Defender
        id: scan
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          # GitHub's Windows computers tell Defender to skip their drives; take that off so the scan is real
          $ex = (Get-MpPreference).ExclusionPath
          if ($ex) { Remove-MpPreference -ExclusionPath $ex }
          & $mp -SignatureUpdate | Out-Null
          # Self-test: the harmless industry test file (EICAR) MUST be caught, or the scan proves nothing
          New-Item -ItemType Directory -Force selftest | Out-Null
          $t = Join-Path (Resolve-Path selftest) 'test.txt'
          [IO.File]::WriteAllBytes($t, [Convert]::FromBase64String('WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo='))
          & $mp -Scan -ScanType 3 -File $t -DisableRemediation | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "Defender self-test failed (code $LASTEXITCODE): the scanner is not working, so no result." }
          Write-Host "Self-test OK: Defender caught the test file."
          $sig = (Get-MpComputerStatus).AntivirusSignatureVersion
          $bad = @()
          foreach ($f in Get-ChildItem scan -Filter *.exe) {
            & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { $bad += $f.Name; Write-Host "FOUND SOMETHING: $($f.Name)" }
            elseif ($LASTEXITCODE -ne 0) { throw "Defender could not scan $($f.Name) (code $LASTEXITCODE)" }
            else { Write-Host "Clean: $($f.Name)" }
          }
          "sig=$sig" >> $env:GITHUB_OUTPUT
          "bad=$($bad -join ', ')" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0   # a find is handled by the next steps, not by failing here

      - name: Clean - add a line to the Release notes
        if: steps.scan.outputs.bad == ''
        shell: pwsh
        run: |
          $notes = (gh release view $env:VERSION --json body --jq .body) -join "`n"
          $line = "**Virus check:** every .exe here was scanned by Microsoft Defender (virus definitions ${{ steps.scan.outputs.sig }}) on $(Get-Date -Format 'yyyy-MM-dd') UTC: nothing found."
          Set-Content -Path notes.md -Value ($line + "`n`n" + $notes) -Encoding utf8
          gh release edit $env:VERSION --notes-file notes.md

      - name: Something found - hide the Release
        if: steps.scan.outputs.bad != ''
        shell: pwsh
        run: |
          gh release edit $env:VERSION --draft=true
          Write-Host "::error::Microsoft Defender flagged: ${{ steps.scan.outputs.bad }}. The Release $env:VERSION is now a Draft (hidden)."
          exit 1
