# Panel version: every merge (push) to the default branch gets a version named PR<n>_<owner>-v.yyyymmdd_hh_mm,
# where PR<n> is the highest merged pull request number (for the time being, Fritz 2026-10-22),
# and <owner> is the GitHub user who owns this copy of the code. oakbarn's own copy says Skynet: PR85_Skynet-v.yyyymmdd_hh_mm.
# Someone else's copy (a fork) says their user name, for example PR3_brewer42-v.yyyymmdd_hh_mm.
# It writes version.json at the top of the panel (the panel shows it on the Menu Bar and in ☰ Menu > About),
# commits it back to the branch, and makes a GitHub tag and Release with the same name.
# The Release carries the Windows installer (Skynet_Brewer_Update_<version>.exe), the Full installer with every Skynet picture
# and sound inside (Skynet_Brewer_Full_Setup_<version>.exe, Rule 9.20), the panel zip, the add-only Skynet Media Setup
# .exe and zip (pictures and sounds, Rule 9.12), the add-only Sample Schemas Setup .exe and zip (Rule 9.13) and the install files,
# built by tools/build-release.sh, so anyone can download them from the Releases page without touching the code.
# Times are UTC. To use your own time zone, change TZ below (for example America/Chicago).
# Never edit version.json by hand or in a pull request: this workflow owns it.
# It also writes skynet_files.json (Rule 9.14, tools/make-file-list.js): the fingerprint of every core program file of this version.
# The panel checks its files against it on every start (lib/official.js), asking this repository for the list of its own version,
# and says Official Skynet, or Changed with the files named. Never edit skynet_files.json by hand either.
# The Media Setup and Media zip are made new only when something in media/ (or the Media Setup's own script) changed since the
# last ones were made (OakBarn Brewery, 2026-11-15, Rule 9.21). Otherwise this Release carries the last ones, unchanged, with
# their own date in the name. The plain Setup and the Full Setup (with every picture and sound inside) are made on every merge.
# Signing: when the Azure Artifact Signing secrets and variables are set (docs/Code_Signing_Setup.md), the Setup .exe and
# the Uninstall .exe inside it are signed, so Windows Smart App Control lets them run. Until then (or if signing fails)
# the Setup .exe is built unsigned as before and the release still happens.
name: Panel version

on:
  push:
    branches: [claude/project-thread-vzxi0a]
    paths-ignore: [version.json, skynet_files.json]
  workflow_dispatch:
    inputs:
      rebuild_media:
        description: "Make the Media Setup and Media zip new even if no picture or sound changed (Rule 9.21)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  id-token: write   # lets this workflow sign in to Azure for signing without a stored password (OIDC)

concurrency:
  group: panel-version
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write version.json
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$OWNER" = "oakbarn" ]; then PREFIX="Skynet"; else PREFIX="$OWNER"; fi
          # the highest merged pull request number; if GitHub does not answer, the #number in the merge message
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&sort=created&direction=desc&per_page=100" \
            --jq '[.[] | select(.merged_at != null) | .number] | max // empty' 2>/dev/null || true)
          [ -n "$PR" ] || PR=$(git log -1 --format=%s | grep -o '#[0-9]\+' | head -1 | tr -d '#' || true)
          [ -n "$PR" ] && PREFIX="PR${PR}_$PREFIX"
          VERSION="$PREFIX-v.$(date +%Y%m%d_%H_%M)"
          # two merges in the same minute: add _2, _3 ...
          base="$VERSION"; n=2
          while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do VERSION="${base}_$n"; n=$((n+1)); done
          # the fingerprint of every core program file (Rule 9.14), so the panel can tell if its files are the official ones
          node tools/make-file-list.js
          cat > version.json <<JSON
          {
            "version": "$VERSION",
            "merged": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "owner": "$OWNER",
            "commit": "${GITHUB_SHA}",
            "repo": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}"
          }
          JSON
          cat version.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json skynet_files.json
          git commit -m "Panel version $VERSION [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git tag "$VERSION"
          git push origin "$VERSION"

      # ---- Signing (docs/Code_Signing_Setup.md). Every signing step is skipped until all six settings are filled in. ----
      - name: Is signing set up?
        id: signcheck
        env:
          C: ${{ secrets.AZURE_CLIENT_ID }}
          T: ${{ secrets.AZURE_TENANT_ID }}
          S: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E: ${{ vars.SIGNING_ENDPOINT }}
          A: ${{ vars.SIGNING_ACCOUNT }}
          P: ${{ vars.SIGNING_PROFILE }}
        run: |
          if [ -n "$C" ] && [ -n "$T" ] && [ -n "$S" ] && [ -n "$E" ] && [ -n "$A" ] && [ -n "$P" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"; echo "Signing is set up."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing is not set up yet, so the Setup .exe will not be signed (see docs/Code_Signing_Setup.md)."
          fi

      - name: Sign in to Azure (for signing)
        id: azlogin
        if: steps.signcheck.outputs.ready == 'true'
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get the signing tool and a signing pass
        if: steps.signcheck.outputs.ready == 'true' && steps.azlogin.outcome == 'success'
        continue-on-error: true
        env:
          E: ${{ vars.SIGNING_ENDPOINT }}
          A: ${{ vars.SIGNING_ACCOUNT }}
          P: ${{ vars.SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          # Jsign signs Windows .exe files on Linux (Apache License 2.0, https://ebourg.github.io/jsign)
          JAR="$RUNNER_TEMP/jsign-7.6.jar"
          curl -sSLf -o "$JAR" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  $JAR" | sha256sum -c -
          TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          {
            echo "SKYNET_SIGN_JAR=$JAR"
            echo "SKYNET_SIGN_ENDPOINT=$E"
            echo "SKYNET_SIGN_ACCOUNT=$A"
            echo "SKYNET_SIGN_PROFILE=$P"
            echo "SKYNET_SIGN_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      # ---- Media only when it changed (Rule 9.21) ----
      - name: Did the Skynet pictures or sounds change?
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          FORCE: ${{ github.event.inputs.rebuild_media }}
        run: |
          mkdir -p release
          build() { echo "$1"; echo "build=yes" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$FORCE" = "true" ] && build "Asked to make the Media Setup new (Run workflow > rebuild media)."
          # the newest published Release that carries a Media zip: "<release tag> <Media zip file name>" (the Media Setup .exe is retired,
          # OakBarn Brewery 2026-11-17: "WE could get rid of both the Schema Uodate and the Media updates"; Rule 9.22)
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not) | {t: .tag_name, a: ([.assets[].name | select(test("^Skynet_Media_[0-9A-Za-z].*\\.zip$"))] | first)} | select(.a != null)] | first // empty | "\(.t) \(.a)"' 2>/dev/null || true)
          [ -n "$LAST" ] || build "No earlier Media Setup found, so it is made new."
          FROM="${LAST%% *}"; MZIP="${LAST#* }"
          MV="${MZIP#Skynet_Media_}"; MV="${MV%.zip}"
          # MV is the version the Media zip was made at; its tag marks the code it was made from
          git rev-parse -q --verify "refs/tags/$MV^{commit}" >/dev/null || build "No tag $MV to compare with, so the Media zip is made new."
          if ! git diff --quiet "$MV" HEAD -- media; then
            git diff --stat "$MV" HEAD -- media | tail -20
            build "Pictures or sounds changed since $MV, so the Media zip is made new."
          fi
          gh release download "$FROM" --pattern "$MZIP" --dir release \
            || build "Could not get the last Media zip from $FROM, so it is made new."
          [ -f "release/$MZIP" ] || build "The last Media zip is missing from $FROM, so it is made new."
          echo "No picture or sound changed since $MV: this Release carries that Media zip, unchanged."
          { echo "build=no"; echo "version=$MV"; } >> "$GITHUB_OUTPUT"

      - name: Build the installer and zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SKYNET_MEDIA_BUILD: ${{ steps.media.outputs.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis zip
          # the Update Setup also carries the Skynet pictures and sounds added since the last Update Setup (OakBarn Brewery,
          # 2026-11-17, Rule 9.22): the tag of the newest published Release that has a Skynet_Brewer_Update (or older Skynet_Brewer_Setup) .exe
          export SKYNET_UPDATE_SINCE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not) | select([.assets[].name | select(test("^Skynet_Brewer_(Update|Setup)_.+\\.exe$"))] | length > 0) | .tag_name] | first // empty' 2>/dev/null || true)
          echo "New pictures, sounds and Sample Schemas since: ${SKYNET_UPDATE_SINCE:-(no earlier Update Setup)}"
          bash tools/build-release.sh "$VERSION"
          # one zip for the first-install folders, so the Release page stays short
          ( cd release && zip -qr "First_Install_ReadMes_$VERSION.zip" First_Install_* )

      - name: Make the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          MV: ${{ steps.media.outputs.version }}
        run: |
          if [ "$MV" = "$VERSION" ]; then MSAME=""; else
            MSAME=" No pictures or sounds changed since \`$MV\`, so these are the same files as on that Release (Rule 9.21)."
          fi
          if grep -q "^signed Setup .exe" release/signing.log 2>/dev/null; then
            WARN="This installer is signed (Microsoft Artifact Signing). For the first few weeks Windows may still say *Windows protected your PC* while it learns the new signature: click **More info**, then **Run anyway**."
          else
            WARN="Windows may say *Windows protected your PC*: click **More info**, then **Run anyway** (this installer is not signed)."
          fi
          cat > notes.md <<NOTES
          **To install on Windows:** download \`Skynet_Brewer_Update_$VERSION.exe\` below and double-click it. It makes \`C:\\Brewing\\BrewPanel\` and puts **Skynet Brewer** on the Desktop. $WARN

          **New on this Windows computer?** download \`Skynet_Brewer_Full_Setup_$VERSION.exe\` instead. It has every Skynet picture, sound and Sample Schema inside. It is always a full install: on a computer that already has Skynet it OVERWRITES everything (it warns first). To update, use the Setup above: it brings the Skynet pictures, sounds and Sample Schemas added since the last one.

          **Mac, Linux, Raspberry Pi or by hand:** download \`Skynet_BrewPanel_$VERSION.zip\` and \`ReadMe.txt\`.

          **Pictures and sounds (Mac, Linux, Raspberry Pi or by hand):** \`Skynet_Media_$MV.zip\`. It only adds the ones you do not have: nothing you have is changed or deleted.$MSAME

          **Sample Schemas (Mac, Linux, Raspberry Pi or by hand):** \`Skynet_Sample_Schemas_$VERSION.zip\`. Add-only, like the pictures and sounds.

          **Language Fonts (only if a Help language shows empty boxes):** \`Skynet_Language_Fonts_Setup_$VERSION.exe\` (Windows) or \`Skynet_Language_Fonts_$VERSION.zip\`. Chinese, Japanese, Korean, Thai and Hindi letters for the Help. Add-only (Help 242).

          NOTES
          # the Language Fonts (Rule 9.24) are on the Release only when they were made (tools/build-release.sh needs npm for them)
          FONT_FILES=$(ls release/Skynet_Language_Fonts_* 2>/dev/null || true)
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --generate-notes --latest $FONT_FILES \
            release/Skynet_Brewer_Update_*.exe release/Skynet_Brewer_Full_Setup_*.exe release/Skynet_BrewPanel_*.zip release/Skynet_Media_*.zip \
            release/Skynet_Sample_Schemas_*.zip release/ReadMe.txt \
            "release/Install Skynet Brewer.command" release/install-skynet-brewer.sh release/Skynet_Brewer.bat \
            release/First_Install_ReadMes_*.zip release/Minimum_Equipment_and_Limitations.txt

  # ---- Virus check (Rule 9.11): Microsoft Defender scans every .exe on the new Release, on a Windows computer at GitHub. ----
  # Clean: a "Virus check" line is added to the Release notes.
  # Anything found: the Release is turned back into a Draft (hidden from the public), this job turns red
  # and GitHub emails oakbarn. Nothing is deleted; look at it, then publish the Draft again or remove it.
  virus-check:
    needs: stamp
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stamp.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Get the .exe files from the Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scan | Out-Null
          gh release download $env:VERSION --pattern '*.exe' --dir scan
          Get-ChildItem scan | Format-Table Name, Length

      - name: Scan them with Microsoft Defender
        id: scan
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          # GitHub's Windows computers tell Defender to skip their drives; take that off so the scan is real
          $ex = (Get-MpPreference).ExclusionPath
          if ($ex) { Remove-MpPreference -ExclusionPath $ex }
          & $mp -SignatureUpdate | Out-Null
          # Self-test: the harmless industry test file (EICAR) MUST be caught, or the scan proves nothing
          New-Item -ItemType Directory -Force selftest | Out-Null
          $t = Join-Path (Resolve-Path selftest) 'test.txt'
          [IO.File]::WriteAllBytes($t, [Convert]::FromBase64String('WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo='))
          & $mp -Scan -ScanType 3 -File $t -DisableRemediation | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "Defender self-test failed (code $LASTEXITCODE): the scanner is not working, so no result." }
          Write-Host "Self-test OK: Defender caught the test file."
          $sig = (Get-MpComputerStatus).AntivirusSignatureVersion
          $bad = @()
          foreach ($f in Get-ChildItem scan -Filter *.exe) {
            & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { $bad += $f.Name; Write-Host "FOUND SOMETHING: $($f.Name)" }
            elseif ($LASTEXITCODE -ne 0) { throw "Defender could not scan $($f.Name) (code $LASTEXITCODE)" }
            else { Write-Host "Clean: $($f.Name)" }
          }
          "sig=$sig" >> $env:GITHUB_OUTPUT
          "bad=$($bad -join ', ')" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0   # a find is handled by the next steps, not by failing here

      - name: Clean - add a line to the Release notes
        if: steps.scan.outputs.bad == ''
        shell: pwsh
        run: |
          $notes = (gh release view $env:VERSION --json body --jq .body) -join "`n"
          $line = "**Virus check:** every .exe here was scanned by Microsoft Defender (virus definitions ${{ steps.scan.outputs.sig }}) on $(Get-Date -Format 'yyyy-MM-dd') UTC: nothing found."
          Set-Content -Path notes.md -Value ($line + "`n`n" + $notes) -Encoding utf8
          gh release edit $env:VERSION --notes-file notes.md

      - name: Something found - hide the Release
        if: steps.scan.outputs.bad != ''
        shell: pwsh
        run: |
          gh release edit $env:VERSION --draft=true
          Write-Host "::error::Microsoft Defender flagged: ${{ steps.scan.outputs.bad }}. The Release $env:VERSION is now a Draft (hidden)."
          exit 1

  # ---- VirusTotal (Rule 9.11): about 70 virus scanners look at every .exe on the new Release. ----
  # Skipped until the VIRUSTOTAL_API_KEY secret is saved (docs/Security_Scanning.md).
  # It only REPORTS: a line with the count and a link goes at the top of the Release notes, and a yellow warning
  # shows if any scanner flags a file. It never hides the Release (Microsoft Defender above does that), because
  # one or two of the 70 often guess wrong on a new installer.
  # Every file sent to VirusTotal is kept there and can be downloaded by its paying members (fine: the Releases are public anyway).
  virustotal:
    needs: [stamp, virus-check]
    if: always() && needs.stamp.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.stamp.outputs.version }}
      VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - name: Send the .exe files to VirusTotal
        run: |
          set -uo pipefail
          if [ -z "$VT_KEY" ]; then echo "No VIRUSTOTAL_API_KEY secret yet, so no VirusTotal check (docs/Security_Scanning.md)."; exit 0; fi
          VT=https://www.virustotal.com/api/v3
          # the free key allows 4 calls a minute, so every call waits 16 seconds first
          vt() { sleep 16; curl -sS -H "x-apikey: $VT_KEY" "$@"; }
          mkdir -p scan && gh release download "$VERSION" --pattern '*.exe' --dir scan
          LINES=""; FLAGGED=""
          for f in scan/*.exe; do
            name=$(basename "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1)
            # files over 32 MB need their own upload address
            if [ "$(stat -c %s "$f")" -gt 33000000 ]; then url=$(vt "$VT/files/upload_url" | jq -r .data); else url="$VT/files"; fi
            id=$(vt -F "file=@$f" "$url" | jq -r '.data.id // empty')
            if [ -z "$id" ]; then echo "::warning::VirusTotal did not take $name"; LINES+="- $name: VirusTotal did not take the file"$'\n'; continue; fi
            # wait for the scanners (up to about 15 minutes)
            for i in $(seq 1 50); do
              res=$(vt "$VT/analyses/$id")
              [ "$(echo "$res" | jq -r .data.attributes.status)" = completed ] && break
            done
            bad=$(echo "$res" | jq -r '(.data.attributes.stats.malicious // 0) + (.data.attributes.stats.suspicious // 0)')
            all=$(echo "$res" | jq -r '[.data.attributes.stats[]] | add // 0')
            echo "$name: $bad of $all scanners flagged it"
            LINES+="- [$name](https://www.virustotal.com/gui/file/$sha): $bad of $all scanners flagged it"$'\n'
            [ "$bad" != 0 ] && FLAGGED+="$name ($bad) "
          done
          [ -n "$FLAGGED" ] && echo "::warning::VirusTotal: some scanners flagged $FLAGGED- open the links in the Release notes to see which."
          notes=$(gh release view "$VERSION" --json body --jq .body)
          printf '**VirusTotal** (%s UTC):\n%s\n%s\n' "$(date -u '+%Y-%m-%d %H:%M')" "$LINES" "$notes" > vt_notes.md
          gh release edit "$VERSION" --notes-file vt_notes.md

  # ---- Keep only the newest Releases (Rule 9.23; OakBarn Brewery, 2026-11-18: "we need to clean that every 25";
  # "Ok if it can do that only keep the last one and the new one"). ----
  # After the new Release is made and checked, every older Panel version Release is deleted, so the Releases page shows
  # only the new one and the one before it. KEEP below is that number; change it to keep more.
  # Only published Releases count: a Release the Virus check turned into a Draft is never counted and never deleted here,
  # so the last good one always stays. Only tags that start with "PR<number>_" or "Skynet-v." are touched (the Releases this
  # workflow makes); the Skynet-Sounds Release (Rule 7.20) and any other Release are never touched.
  # The tags stay: only the Release pages and their downloads go. The panel's Official Skynet check (Rule 9.14) reads
  # skynet_files.json by tag, so an older install still checks out after its Release page is gone.
  keep-newest:
    needs: [stamp, virus-check, virustotal]
    if: always() && needs.stamp.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: 2
    steps:
      - name: Delete the older Releases
        run: |
          set -euo pipefail
          R="repos/$GITHUB_REPOSITORY/releases"
          gh api "$R?per_page=100" --paginate \
            --jq '.[] | select(.draft | not) | select(.tag_name | test("^(PR[0-9]+_|Skynet-v\\.)")) | "\(.created_at) \(.id) \(.tag_name)"' \
            | sort -r > all.txt
          echo "$(wc -l < all.txt) Panel version Releases; keeping the newest $KEEP:"
          head -n "$KEEP" all.txt | awk '{print "  keep " $3}'
          tail -n +"$((KEEP+1))" all.txt | while read -r when id tag; do
            gh api -X DELETE "$R/$id" && echo "  deleted $tag"
          done
