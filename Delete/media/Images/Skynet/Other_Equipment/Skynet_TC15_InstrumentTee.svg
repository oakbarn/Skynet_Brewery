<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 56">
  <!-- Skynet TC 1.5 inch instrument tee (after Fritz's drawing): a short tee with a short, narrow branch for a probe or gauge.
       Openings at the middle of the Left, Right and Top edges; drawn 100 x 56, so its Template makes it 90 x 50 on a Tab. -->
  <path d="M9 41 V15 H37 A4 4 0 0 0 41 11 V8 H59 V11 A4 4 0 0 0 63 15 H91 V41 Z" fill="#808080" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#808080" stroke="#000" stroke-width="2.5">
    <rect x="2" y="6" width="8" height="44" rx="2"/>
    <rect x="90" y="6" width="8" height="44" rx="2"/>
    <rect x="34" y="2" width="32" height="7" rx="2"/>
  </g>
</svg>
